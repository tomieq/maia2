version: "3.8"

networks:
  home-network:
    name: home-network
services:
  maia2:
    container_name: maia2-rest
    build:
      context: .
      dockerfile: Dockerfile
    image: maia2-rest:1.0.0
    ports:
      - "8095:8080"
    networks:
      - home-network
    restart: unless-stopped
    # Optional: mount local model folder for easier updates during development.
    # Remove or comment out the volume line if you prefer the models baked into the image.
    volumes:
      - ./maia2_models:/app/maia2_models:ro
    environment:
      - PYTHONUNBUFFERED=1
    # Use a single process by default; adjust command if you want more workers
    command: ["uvicorn", "maia2.rest:app", "--host", "0.0.0.0", "--port", "8080", "--workers", "1"]
